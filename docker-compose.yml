x-app: &app
  build: .
  env_file: [.env]
  environment:
    DATABASE_URL: postgres://app:app@postgres:5432/app
    REDIS_URL: redis://redis:6379/0
    LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
  volumes: [media:/app/media]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app}
    ports: ["5433:5432"]   # 5433 để khỏi đụng Postgres cài sẵn trên máy
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi -b 0.0.0.0:8000 --workers 2 --timeout 300"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 10
  worker:
    <<: *app
    command: celery -A config worker -l info
  langfuse-db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: lf, POSTGRES_PASSWORD: lf, POSTGRES_DB: lf}
    volumes: [lfdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lf"]
      interval: 5s
      retries: 10
  langfuse:
    image: langfuse/langfuse:2
    depends_on: {langfuse-db: {condition: service_healthy}}
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://lf:lf@langfuse-db:5432/lf
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-secret
      SALT: dev-salt
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-dev}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-dev}
      LANGFUSE_INIT_ORG_ID: local
      LANGFUSE_INIT_PROJECT_ID: knowledge
      LANGFUSE_INIT_USER_EMAIL: admin@example.com
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: adminadmin

volumes: {pgdata: {}, lfdata: {}, media: {}}
