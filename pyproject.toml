[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "Internal Knowledge Assistant: RAG + agent + MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.1,<5.3",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "dj-database-url>=2.2",
    "celery[redis]>=5.4",
    "gunicorn>=23",
    "pypdf>=5",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.3",
    "langgraph-checkpoint-postgres>=2",
    "mcp>=1.2",
    "langfuse>=2.50,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3"]
eval = ["ragas>=0.2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9", "factory-boy>=3.3", "ruff>=0.8", "mypy>=1.13", "pre-commit>=4"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ008"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
